services:
  - type: web
    name: hawkercredit-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STAFF_BOOTSTRAP_SECRET
        generateValue: true
      - key: DEMO_SEED_ON_STARTUP
        value: "true"
